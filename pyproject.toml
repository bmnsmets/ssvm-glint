[project]
name = "ssvm-glint"
version = "0.1.0"
description = "GLInT experiments for the SSVM 2027 'Symmetry Fingerprinting with Geometric Learnable Invariants Transformers' paper"
readme = "README.md"
authors = [
    { name = "Bart M.N. Smets", email = "b.m.n.smets@tue.nl" },
    { name = "Gijs Bellaard", email = "g.bellaard@tue.nl" },
    { name = "Pieter Wils", email = "p.f.e.j.wils@student.tue.nl" },
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "einops>=0.8.1",
    "ipykernel>=7.1.0",
    "ipython>=9.9.0",
    "matplotlib>=3.10.7",
    "rich>=14.2.0",
    "wandb>=0.25.0",
    "nbformat>=0.5.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.67.3",
    "opt-einsum>=3.4.0",
    "safetensors>=0.8.0",
    "tensordict>=0.14.2",
]


[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", group = "cu11" },
    { index = "pytorch-cu126", group = "cu12" },
    { index = "pytorch-cu132", group = "cu13" },
    { index = "pytorch-cpu", group = "cpu" },
]
torchvision = [
    { index = "pytorch-cu118", group = "cu11" },
    { index = "pytorch-cu126", group = "cu12" },
    { index = "pytorch-cu132", group = "cu13" },
    { index = "pytorch-cpu", group = "cpu" },
]


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
cu11 = ["torch==2.7.1", "torchvision==0.22.1"]
cu12 = ["torch>=2.14.1", "torchvision>=0.29.1"]
cu13 = ["torch>=2.14.1", "torchvision>=0.29.1"]
cpu = ["torch>=2.14.1", "torchvision>=0.29.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "cu13"]
conflicts = [
    [
        { group = "cu11" },
        { group = "cu12" },
        { group = "cu13" },
        { group = "cpu" },
    ],
]


[tool.ty.rules]
invalid-mutable-override = "ignore"
